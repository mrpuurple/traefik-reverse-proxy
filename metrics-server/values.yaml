# Metrics Server Helm Chart Configuration
# Chart: metrics-server/metrics-server
# Version: 3.12.2
# App Version: 0.7.2
#
# This values file contains Docker Desktop specific overrides
# Full configuration: https://artifacthub.io/packages/helm/metrics-server/metrics-server

# Docker Desktop requires TLS verification to be disabled for metrics-server
# due to self-signed certificates used by Docker Desktop's kubelet
args:
  - --kubelet-insecure-tls

# Prometheus metrics integration
metrics:
  enabled: true

# Service configuration for Prometheus scraping
service:
  type: ClusterIP
  port: 443
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "10250"
    prometheus.io/scheme: "https"

# Resource limits optimized for local development
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# API service configuration
apiService:
  create: true
  insecureSkipTLSVerify: true

# ServiceMonitor for Prometheus Operator (if needed in future)
serviceMonitor:
  enabled: false
  # Uncomment if using Prometheus Operator
  # enabled: true
  # interval: 30s
  # scrapeTimeout: 10s

# Pod security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# High availability settings (can be increased for production)
replicas: 1

# Update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
