apiVersion: v1
kind: Service
metadata:
  name: sticky-tester-clientip
  namespace: sticky-session-tester
  labels:
    app: sticky-session-tester
    service-type: clientip
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: sticky-session-tester
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
