apiVersion: apps/v1
kind: Deployment
metadata:
  name: sticky-session-tester
  namespace: sticky-session-tester
  labels:
    app: sticky-session-tester
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sticky-session-tester
  template:
    metadata:
      labels:
        app: sticky-session-tester
    spec:
      containers:
      - name: sticky-session-tester
        image: sticky-session-tester:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CONTAINER_NAME
          value: "sticky-session-tester"
        - name: SERVICE_NAME
          value: "sticky-session-tester"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /sticky-app/actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /sticky-app/actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /sticky-app/actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 3
