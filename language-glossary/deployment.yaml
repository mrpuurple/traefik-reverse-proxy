apiVersion: apps/v1
kind: Deployment
metadata:
  name: language-glossary
  namespace: default
  labels:
    app: language-glossary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: language-glossary
  template:
    metadata:
      labels:
        app: language-glossary
    spec:
      containers:
      - name: language-glossary
        image: language-glossary:latest
        imagePullPolicy: Never  # Use local Docker image
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: language-glossary
  namespace: default
  labels:
    app: language-glossary
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: language-glossary
